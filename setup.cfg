[metadata]
name = anisotropy-verification
version = 0.1.0
description = Validation-first data contracts for the Phi/Psi symmetry-coupling verification experiment
long_description = file: README.md
long_description_content_type = text/markdown
author = Shawn Damrat

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest>=7
